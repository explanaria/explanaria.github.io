<body>

  <script type="module">

    import * as EXP from "../resources/build/explanaria-bundle.js";
	var three = EXP.setupThree();
	var controls = new EXP.OrbitControls(three.camera,three.renderer.domElement);
	controls.enableRotate = false;

	three.camera.position.set(0,0,10);
	three.camera.lookAt(new THREE.Vector3(0,0,0));

	console.log("Loaded.");

	let lightblue = "hsl(240, 90%, 70%)";
	let orangered = 0xff7070;


	var params = {};
	params.radius=4;
	params.freq = 2;

    function polarToCartesian(theta, r){
        return [r*Math.cos(theta),r*Math.sin(theta),0];
    }

    let numberline = new EXP.Area({bounds: [[-10,10]],numItems:[21]});
    numberline.add(new EXP.LineOutput({width:5,color:0x333333,opacity:1}));
    numberline.add(new EXP.PointOutput({width:5,color:0x555555,opacity:0.3, width: 0.3}));

    let numbers = new EXP.Area({bounds: [[1,10]],numItems:[10]});

    let args = {r:1, theta: 0};

    var transform = new EXP.Transformation({'expr': (i,t,x,y) => [x * args.r *Math.cos(args.theta) + y*args.r*Math.sin(args.theta),x*args.r *Math.sin(args.theta) + y*args.r *Math.cos(args.theta)]});

    numbers.add(transform).add(new EXP.PointOutput({color: 0x55aa55, width: 0.5}));
    numbers.add(new EXP.Transformation({'expr': (i,t,x,y) => [-x,0]})).add(transform.makeLink()).add(new EXP.PointOutput({color: 0xaa5555, width: 0.5}));



	//ok now back to the actual animation

	three.on("update",function(time){
		[numberline, numbers].map(i => i.activate(time.t));
	});


	var presentation = new EXP.UndoCapableDirector();

	controls.enablePan = false;
	await presentation.begin();
	await presentation.nextSlide();

    presentation.TransitionTo(args, {"r": 1, "theta": Math.PI},2000);
	await presentation.nextSlide();
    presentation.TransitionTo(args, {"r": 1, "theta": 0},500);

	await presentation.nextSlide();

    presentation.TransitionTo(args, {"r": 1, "theta": Math.PI/2},1000);

	await presentation.nextSlide();
    presentation.TransitionTo(args, {"r": 1, "theta": Math.PI},1000);
  </script>
